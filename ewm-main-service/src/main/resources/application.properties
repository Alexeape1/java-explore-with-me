# Server
server.port=8080

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ewm_main}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ewm_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ewm_password}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Stats server URL
stats-server.url=http://localhost:9090

# Logging
logging.level.ru.practicum=DEBUG
logging.level.org.springframework.web=DEBUG

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE